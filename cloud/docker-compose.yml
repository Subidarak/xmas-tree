services:
  caddy:
    image: caddy:2-alpine
    container_name: xmas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./data:/giftsdata:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: node:20-alpine
    container_name: xmas-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "/app/server.js"]
    volumes:
      - ./server.js:/app/server.js:ro
      - ./data:/data
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
    mem_limit: 192m
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
